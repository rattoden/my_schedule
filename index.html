const now = new Date();
const currentDate = new Date(now.getFullYear(),now.getMonth(),now.getDate());
const start = new Date(currentDate); start.setDate(start.getDate()-7);
const end = new Date(2026,11,31);
const fmt = new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'});
const monthShort = new Intl.DateTimeFormat('ru-RU',{month:'short'});
const weekdays = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const weekdaysShort = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const oddWeekAnchor = new Date(2026,9,19); // неделя 19–25 октября указана как нечётная
function isOddWeek(d){const monday=new Date(d.getFullYear(),d.getMonth(),d.getDate());monday.setDate(monday.getDate()-((monday.getDay()+6)%7));const diff=Math.round((monday-oddWeekAnchor)/604800000);return ((diff%2)+2)%2===0}
const strip=document.getElementById('date-strip');
const selectedDay=document.getElementById('selected-day');
let selectedKey=iso(currentDate);
function renderSelected(key){
 selectedKey=key;
 const d=new Date(key+'T12:00:00');
 document.querySelectorAll('.date-btn').forEach(btn=>{const active=btn.dataset.date===key;btn.classList.toggle('selected',active);btn.setAttribute('aria-pressed',active?'true':'false')});
 document.getElementById('weekpill').textContent=(isOddWeek(d)?'Нечётная':'Чётная')+' неделя';
 const todays=lessons.filter(x=>x.dates.includes(key)).sort((a,b)=>a.time.localeCompare(b.time));
 const section=document.createElement('section');section.className='day';
 const head=document.createElement('div');head.className='dayhead';
 const title=document.createElement('div');title.className='daytitle';title.textContent=weekdays[d.getDay()]+', '+fmt.format(d);
 const subtitle=document.createElement('small');subtitle.textContent=(isOddWeek(d)?'Нечётная':'Чётная')+' неделя';title.appendChild(subtitle);
 head.appendChild(title);
 if(key===iso(currentDate)){const badge=document.createElement('span');badge.className='today';badge.textContent='Сегодня';head.appendChild(badge)}
 section.appendChild(head);
 if(!todays.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='В этот день занятий нет';section.appendChild(empty)}
 todays.forEach(x=>{const item=document.createElement('div');item.className='lesson';item.style.setProperty('--accent',x.color);item.style.setProperty('--tagbg',x.color+'18');

 const meta1=document.createElement('div');meta1.className='meta';meta1.innerHTML='<span class="ico">⌖</span><span></span>';meta1.lastElementChild.textContent=(x.building==='КСК'?'КСК':'Корпус '+x.building)+' · '+(x.room==='ОЛИМП4'?'ОЛИМП4':'ауд. '+x.room);

 content.append(meta1,meta2);item.append(time,rail,content);section.appendChild(item);
 });

}
for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
 const key=iso(d);const btn=document.createElement('button');btn.type='button';btn.className='date-btn';btn.dataset.date=key;
 if(key===iso(currentDate))btn.classList.add('today');
 const dow=document.createElement('span');dow.className='dow';dow.textContent=weekdaysShort[d.getDay()];

renderSelected(selectedKey);
